<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Typing4English — タイピングで英語をおぼえよう</title>
    <meta name="description" content="小学生・中学生のための英語タイピング練習。10本指のタッチタイピングと英検5級〜1級の単語を、音声つきで楽しく学べます。" />
    <meta name="theme-color" content="#FBF9F5" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <!-- Apply the saved theme before first paint so the page never flashes the wrong colours. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('t4e:settings') || '{}');
        var dark = s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var q = new URLSearchParams(location.search).get('lang'); // see takeLangParam in src/lib/store.ts
        var lang = q === 'ja' || q === 'vi' || q === 'en' ? q : s.uiLang;
        if (lang) document.documentElement.lang = lang;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
