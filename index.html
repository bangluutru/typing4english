<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://typing4english.chottoday.com/" />
    <title>Typing4English — タイピングで英語をおぼえよう</title>
    <meta name="description" content="小学生・中学生のための英語タイピング練習。10本指のタッチタイピングと英検5級〜1級の単語を、音声つきで楽しく学べます。" />
    <meta name="theme-color" content="#FBF9F5" />

    <!-- Link preview (Facebook, Zalo, X, Slack…). No og:image on purpose: the only
         logo is favicon.svg and most preview bots ignore SVG. Add a 1200×630 PNG
         made with chottoday's scripts/images/card.py later, never a model-drawn one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Typing4English" />
    <meta property="og:url" content="https://typing4english.chottoday.com/" />
    <meta property="og:title" content="Typing4English — タイピングで英語をおぼえよう" />
    <meta property="og:description" content="小学生・中学生のための英語タイピング練習。10本指のタッチタイピングと英検5級〜1級の単語を、音声つきで楽しく学べます。" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Typing4English — タイピングで英語をおぼえよう" />
    <meta name="twitter:description" content="小学生・中学生のための英語タイピング練習。10本指のタッチタイピングと英検5級〜1級の単語を、音声つきで楽しく学べます。" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <!-- Apply the saved theme, language and tab title before first paint so nothing flashes.
         The language pick mirrors takeLangParam/detectLang in src/lib/store.ts;
         the titles come from 'meta.title' in src/i18n (injected by vite.config.ts). -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('t4e:settings') || '{}');
        var dark = s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var titles = __T4E_TITLES__;
        var q = new URLSearchParams(location.search).get('lang');
        var nav = (navigator.language || 'ja').toLowerCase();
        var has = function (k) { return Object.prototype.hasOwnProperty.call(titles, k); }; // not ?lang=toString
        var lang = has(q) ? q : has(s.uiLang) ? s.uiLang : nav.indexOf('vi') === 0 ? 'vi' : nav.indexOf('en') === 0 ? 'en' : 'ja';
        document.documentElement.lang = lang;
        document.title = titles[lang];
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
